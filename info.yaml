project:
  title: "8-channel DBS analog front end with SAR ADC"
  team: "GAJT"
  discord: ""
  description: "8-channel electrode routing + per-channel LFP amplifier (60 dB) + per-channel 12-bit SAR ADC with SPI, raw recording pins, GF180MCU 3.3 V"
  lvs_config: "lvs_config.json"
  gf_def_ready: false
  ws_def_ready: false
  drc_ready: false
  lvs_ready: false
  export_control: "documents/Export_Control_GF_Rev8.2.docx"

# Pad types: analog = ASIG5V pad; DOUT is bidirectional because there is no output-only type
# (tie DOUT_OE=1, DOUT_IE=0, _PD=_PU=0 and set _CS/_SL/_PDRV inside the macro wrapper).
# Every pad control pin must be driven by the top cell (see the template comments).
pins:
  - name: E[0]
    io_type: analog
  - name: E[1]
    io_type: analog
  - name: E[2]
    io_type: analog
  - name: E[3]
    io_type: analog
