# ----- ------ ----- ----- ------ ----- ----- ------ -----
# Chipathon 2026: Project configuration
# DRAFT (pad list updated 2026-11-21, Decision 53 = 20 pads (Decision 52: 4 channels, outline 605 x 1110 um, + REC[3:0]; rotated to 1405 x 605 um on branch tapeout-todos); was 24 pads, Decisions 44b / 45; pad ORDER = the floorplan perimeter): top cell name, team name and ready flags are provisional
# (waiting on the organizer: macro name/DEF, slot, pad allocation; defaults in AFE/layout/ACCEPT.md section 5). L4 sets the four *_ready flags to true after gate.py L4 passes. See AFE/TAPEOUT.md.
# ----- ------ ----- ----- ------ ----- ----- ------ -----

project:
  title: "4-channel DBS analog front end with SAR ADC"
  team: "GAJT"
  discord: ""
  description: "4-channel electrode routing + per-channel LFP amplifier (60 dB) + per-channel 12-bit SAR ADC with SPI, GF180MCU 3.3 V"
  lvs_config: "lvs_config.json"
  gf_def_ready: false
  ws_def_ready: false
  drc_ready: false
  lvs_ready: false
  export_control: "documents/Export_Control_GF_Rev8.2.docx"

# 20 pads (Decisions 52, 53): 13 analog (E[3:0], IPG[3:0], REC[3:0], REF) + 5 digital (CS, DIN, SCLK, RSTN, DOUT) + VDD + VSS.
# REC[k] = raw analog recording output of channel k (record switch output = amplifier input, before amplification): high-impedance probe only.
# Pad types: analog = ASIG5V pad; DOUT is bidirectional because there is no output-only type.
# Top-cell ports per the organizer template (AFE/top/dbs_afe_top.v): pad DOUT -> ports DOUT_OUT (to pad A) and DOUT_IN (from pad Y, unused)
# plus its 8 control pins, all driven inside the top cell: DOUT_OE = ~CS (the pad drives only while CS is low), DOUT_IE = 0, DOUT_PD = DOUT_PU = 0,
# DOUT_CS = 0 (CMOS), DOUT_SL = 0 (fast), DOUT_PDRV1:0 = 00 (4 mA).  Input pads: <name>_PD / <name>_PU driven, all 0 except RSTN_PD = 1
# (the chip stays in reset until the host drives RSTN).  Values to be confirmed in L4.
# Pads listed in pad-slot order 1-20 (tapeout-todos, AFE/layout/top_frame.json): the organizer block is 605 um tall x 1405 um wide (allowed 1405 .. 1620), the L3a layout rotated 90 deg clockwise.
# Left edge, south to north: 1-6 = IPG[3] REC[3] E[3] IPG[2] REC[2] E[2]; top edge, west to east: 7-13 = VSS RSTN SCLK DIN CS DOUT VDD, 14-19 = E[0] REC[0] IPG[0] E[1] REC[1] IPG[1], 20 = REF.
# 20 of the 22 slots used. The order is a suggestion for the organizer's DEF; the names and types are what counts.
pins:
  - name: IPG[3]
    io_type: analog
  - name: REC[3]
    io_type: analog
  - name: E[3]
    io_type: analog
  - name: IPG[2]
    io_type: analog
  - name: REC[2]
    io_type: analog
  - name: E[2]
    io_type: analog
  - name: VSS
    io_type: ground
  - name: RSTN
    io_type: input_schmitt
  - name: SCLK
    io_type: input_schmitt
  - name: DIN
    io_type: input_cmos
  - name: CS
    io_type: input_cmos
  - name: DOUT
    io_type: bidirectional
  - name: VDD
    io_type: power
  - name: E[0]
    io_type: analog
  - name: REC[0]
    io_type: analog
  - name: IPG[0]
    io_type: analog
  - name: E[1]
    io_type: analog
  - name: REC[1]
    io_type: analog
  - name: IPG[1]
    io_type: analog
  - name: REF
    io_type: analog
